<line x1="655.3" y1="176.0" x2="765.5" y2="176.0" stroke="#bd4d0a" stroke-width="1.0"/><path d="M655.3,176.0 l6.0,-2.6 l0,5.2 z" fill="#bd4d0a"/><path d="M765.5,176.0 l-6.0,-2.6 l0,5.2 z" fill="#bd4d0a"/><rect x="700.4" y="168.5" width="20.0" height="11" fill="#f7f5f2"/><text x="710.4" y="179.6" font-size="10" text-anchor="middle" fill="#bd4d0a" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">58</text><text x="710.4" y="163.0" font-size="8.8" text-anchor="middle" fill="#6e6a65" font-weight="400" font-family="ui-sans-serif, system-ui, sans-serif">Muldenbreite</text><line x1="800.9" y1="190.0" x2="834.9" y2="190.0" stroke="#a8a29a" stroke-width="0.7"/><line x1="800.9" y1="239.4" x2="834.9" y2="239.4" stroke="#a8a29a" stroke-width="0.7"/><line x1="840.9" y1="190.0" x2="840.9" y2="239.4" stroke="#bd4d0a" stroke-width="1.0"/><path d="M840.9,190.0 l-2.6,6.0 l5.2,0 z" fill="#bd4d0a"/><path d="M840.9,239.4 l-2.6,-6.0 l5.2,0 z" fill="#bd4d0a"/><g transform="translate(840.9,214.7) rotate(-90)"><rect x="-10.0" y="-7.5" width="20.0" height="11" fill="#f7f5f2"/><text x="0" y="3.6" font-size="10" text-anchor="middle" fill="#bd4d0a" font-weight="600" font-family="ui-monospace, Menlo, monospace">26</text></g><g transform="translate(824.9,214.7) rotate(-90)"><text x="0" y="0" font-size="8.8" text-anchor="middle" fill="#6e6a65" font-family="ui-sans-serif, system-ui, sans-serif">Muldentiefe</text></g><text x="54.0" y="555.8" font-size="10.5" text-anchor="start" fill="#1a1a1e" font-weight="400" font-family="ui-sans-serif, system-ui, sans-serif">Die Mulde ist ein Einschnitt von OBEN in die Frontwand — dort greift die Hand von vorne hinein.</text><text x="54.0" y="576.8" font-size="10.5" text-anchor="start" fill="#6e6a65" font-weight="400" font-family="ui-sans-serif, system-ui, sans-serif">Der Beutel wird nicht angehoben, sondern nach vorne herausgezogen und dabei &#252;ber die Frontwand gekippt.</text><text x="54.0" y="597.8" font-size="10.5" text-anchor="start" fill="#6e6a65" font-weight="400" font-family="ui-sans-serif, system-ui, sans-serif">Deshalb bleibt der Zugriff auch dann frei, wenn eine weitere Ebene direkt dar&#252;ber steht.</text><text x="580.0" y="613.8" font-size="9.5" text-anchor="start" fill="#6e6a65" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif">POSITIONEN</text><circle cx="588.0" cy="632.3" r="8.0" fill="none" stroke="#1a1a1e" stroke-width="1.0"/><text x="588.0" y="635.8" font-size="9" text-anchor="middle" fill="#1a1a1e" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1</text><text x="604.0" y="635.8" font-size="10" text-anchor="start" fill="#1a1a1e" font-weight="400" font-family="ui-sans-serif, system-ui, sans-serif">Frontwand, h&#228;lt den Stapel</text><text x="946.0" y="635.8" font-size="10" text-anchor="end" fill="#bd4d0a" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">92 hoch</text><circle cx="588.0" cy="651.3" r="8.0" fill="none" stroke="#1a1a1e" stroke-width="1.0"/><text x="588.0" y="654.8" font-size="9" text-anchor="middle" fill="#1a1a1e" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">2</text><text x="604.0" y="654.8" font-size="10" text-anchor="start" fill="#1a1a1e" font-weight="400" font-family="ui-sans-serif, system-ui, sans-serif">Greifraum bis zur Ebene dar&#252;ber</text><text x="946.0" y="654.8" font-size="10" text-anchor="end" fill="#bd4d0a" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">72 hoch</text><circle cx="588.0" cy="670.3" r="8.0" fill="none" stroke="#1a1a1e" stroke-width="1.0"/><text x="588.0" y="673.8" font-size="9" text-anchor="middle" fill="#1a1a1e" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">3</text><text x="604.0" y="673.8" font-size="10" text-anchor="start" fill="#1a1a1e" font-weight="400" font-family="ui-sans-serif, system-ui, sans-serif">Beutel, steht &#252;ber die Wand</text><text x="946.0" y="673.8" font-size="10" text-anchor="end" fill="#bd4d0a" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">44 frei</text><circle cx="588.0" cy="689.3" r="8.0" fill="none" stroke="#1a1a1e" stroke-width="1.0"/><text x="588.0" y="692.8" font-size="9" text-anchor="middle" fill="#1a1a1e" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">4</text><text x="604.0" y="692.8" font-size="10" text-anchor="start" fill="#1a1a1e" font-weight="400" font-family="ui-sans-serif, system-ui, sans-serif">Griffmulde, von oben eingeschnitten</text><text x="946.0" y="692.8" font-size="10" text-anchor="end" fill="#bd4d0a" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">58 x 26</text></g><line x1="26" y1="688" x2="940" y2="688" stroke="#1a1a1e" stroke-width="1.6"/><text x="26" y="710" font-size="14" fill="#1a1a1e" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif">Zugriff</text><text x="26" y="727" font-size="10" fill="#6e6a65" font-family="ui-sans-serif, system-ui, sans-serif">Wo die Hand hinkommt und warum die Ebenen sich nicht gegenseitig blockieren</text><text x="940" y="710" font-size="11.5" fill="#bd4d0a" font-weight="700" text-anchor="end" font-family="ui-monospace, Menlo, monospace">TEIL 08</text><text x="940" y="727" font-size="10" fill="#6e6a65" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif">Alle Ma&#223;e in mm</text></svg>