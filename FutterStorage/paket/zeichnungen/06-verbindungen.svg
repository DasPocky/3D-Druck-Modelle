.8" font-size="10.5" text-anchor="start" fill="#6e6a65" font-weight="400" font-family="ui-sans-serif, system-ui, sans-serif">Ringsum 0,2 mm Spiel — bei strammem Sitz die Passung im Modell erhöhen.</text><text x="60.0" y="429.8" font-size="10.5" text-anchor="start" fill="#6e6a65" font-weight="400" font-family="ui-sans-serif, system-ui, sans-serif">An den Randspalten entfällt die äußere Tasche.</text><text x="546.0" y="379.8" font-size="9.5" text-anchor="start" fill="#6e6a65" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif">POSITIONEN</text><circle cx="554.0" cy="398.3" r="8.0" fill="none" stroke="#1a1a1e" stroke-width="1.0"/><text x="554.0" y="401.8" font-size="9" text-anchor="middle" fill="#1a1a1e" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1</text><text x="570.0" y="401.8" font-size="10" text-anchor="start" fill="#1a1a1e" font-weight="400" font-family="ui-sans-serif, system-ui, sans-serif">Zapfen, Fortsetzung der Seitenwand</text><text x="912.0" y="401.8" font-size="10" text-anchor="end" fill="#bd4d0a" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">22 lang</text><circle cx="554.0" cy="417.3" r="8.0" fill="none" stroke="#1a1a1e" stroke-width="1.0"/><text x="554.0" y="420.8" font-size="9" text-anchor="middle" fill="#1a1a1e" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">2</text><text x="570.0" y="420.8" font-size="10" text-anchor="start" fill="#1a1a1e" font-weight="400" font-family="ui-sans-serif, system-ui, sans-serif">Tasche im Boden der Ebene darüber</text><text x="912.0" y="420.8" font-size="10" text-anchor="end" fill="#bd4d0a" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ringsum + Spiel</text><circle cx="554.0" cy="436.3" r="8.0" fill="none" stroke="#1a1a1e" stroke-width="1.0"/><text x="554.0" y="439.8" font-size="9" text-anchor="middle" fill="#1a1a1e" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">3</text><text x="570.0" y="439.8" font-size="10" text-anchor="start" fill="#1a1a1e" font-weight="400" font-family="ui-sans-serif, system-ui, sans-serif">Die Ebenen liegen auf den Wänden auf</text><text x="912.0" y="439.8" font-size="10" text-anchor="end" fill="#bd4d0a" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">nicht auf den Zapfen</text><circle cx="554.0" cy="455.3" r="8.0" fill="none" stroke="#1a1a1e" stroke-width="1.0"/><text x="554.0" y="458.8" font-size="9" text-anchor="middle" fill="#1a1a1e" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">4</text><text x="570.0" y="458.8" font-size="10" text-anchor="start" fill="#1a1a1e" font-weight="400" font-family="ui-sans-serif, system-ui, sans-serif">Nase am Bodenrand</text><text x="912.0" y="458.8" font-size="10" text-anchor="end" fill="#bd4d0a" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">20 lang</text><circle cx="554.0" cy="474.3" r="8.0" fill="none" stroke="#1a1a1e" stroke-width="1.0"/><text x="554.0" y="477.8" font-size="9" text-anchor="middle" fill="#1a1a1e" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">5</text><text x="570.0" y="477.8" font-size="10" text-anchor="start" fill="#1a1a1e" font-weight="400" font-family="ui-sans-serif, system-ui, sans-serif">Tasche in der Nachbarspalte</text><text x="912.0" y="477.8" font-size="10" text-anchor="end" fill="#bd4d0a" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">unter dem Innenraum</text><text x="60.0" y="457.8" font-size="10.5" text-anchor="start" fill="#1a1a1e" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif">DIE 27 VARIANTEN — was an welchem Rand entfällt</text><line x1="60.0" y1="462.8" x2="329.6" y2="462.8" stroke="#bd4d0a" stroke-width="1.4"/><text x="60.0" y="479.8" font-size="10.5" text-anchor="start" fill="#1a1a1e" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif">Achse</text><text x="210.0" y="479.8" font-size="10.5" text-anchor="start" fill="#1a1a1e" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif">Werte</text><text x="360.0" y="479.8" font-size="10.5" text-anchor="start" fill="#1a1a1e" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif">Was sich ändert</text><line x1="60.0" y1="487.8" x2="680.0" y2="487.8" stroke="#1a1a1e" stroke-width="1.0"/><text x="60.0" y="505.8" font-size="10.5" text-anchor="start" fill="#1a1a1e" font-weight="400" font-family="ui-sans-serif, system-ui, sans-serif">Tiefe (Y)</text><text x="210.0" y="505.8" font-size="10.5" text-anchor="start" fill="#bd4d0a" font-weight="400" font-family="ui-sans-serif, system-ui, sans-serif">front · mitte · end</text><text x="360.0" y="505.8" font-size="10.5" text-anchor="start" fill="#6e6a65" font-weight="400" font-family="ui-sans-serif, system-ui, sans-serif">Anschlagwand vorne, Rückwand hinten</text><text x="60.0" y="531.8" font-size="10.5" text-anchor="start" fill="#1a1a1e" font-weight="400" font-family="ui-sans-serif, system-ui, sans-serif">Höhe (Z)</text><text x="210.0" y="531.8" font-size="10.5" text-anchor="start" fill="#bd4d0a" font-weight="400" font-family="ui-sans-serif, system-ui, sans-serif">unten · mitte · oben</text><text x="360.0" y="531.8" font-size="10.5" text-anchor="start" fill="#6e6a65" font-weight="400" font-family="ui-sans-serif, system-ui, sans-serif">oben ohne Zapfen, unten ohne Taschen</text><text x="60.0" y="557.8" font-size="10.5" text-anchor="start" fill="#1a1a1e" font-weight="400" font-family="ui-sans-serif, system-ui, sans-serif">Breite (X)</text><text x="210.0" y="557.8" font-size="10.5" text-anchor="start" fill="#bd4d0a" font-weight="400" font-family="ui-sans-serif, system-ui, sans-serif">links · mitte · rechts</text><text x="360.0" y="557.8" font-size="10.5" text-anchor="start" fill="#6e6a65" font-weight="400" font-family="ui-sans-serif, system-ui, sans-serif">außen ohne Verbindertasche</text><text x="60.0" y="605.8" font-size="10.5" text-anchor="start" fill="#1a1a1e" font-weight="400" font-family="ui-sans-serif, system-ui, sans-serif">3 × 3 × 3 = 27 Varianten. Der Vollausbau aus 5 Spalten und 3 Ebenen braucht 45 Segmente,</text><text x="60.0" y="624.8" font-size="10.5" text-anchor="start" fill="#6e6a65" font-weight="400" font-family="ui-sans-serif, system-ui, sans-serif">und jede der 27 kommt darin mindestens einmal vor. Die Dateien liegen unter stl/segmente/.</text><text x="60.0" y="647.8" font-size="10.5" text-anchor="start" fill="#6e6a65" font-weight="400" font-family="ui-sans-serif, system-ui, sans-serif">Beispiel: das vorderste Segment der untersten Ebene ganz links heißt front-unten-links.stl</text></g><line x1="26" y1="641" x2="938" y2="641" stroke="#1a1a1e" stroke-width="1.6"/><text x="26" y="663" font-size="14" fill="#1a1a1e" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif">Verbindungen</text><text x="26" y="680" font-size="10" fill="#6e6a65" font-family="ui-sans-serif, system-ui, sans-serif">Wie die Ebenen und die Spalten zusammengehalten werden</text><text x="938" y="663" font-size="11.5" fill="#bd4d0a" font-weight="700" text-anchor="end" font-family="ui-monospace, Menlo, monospace">TEIL 07</text><text x="938" y="680" font-size="10" fill="#6e6a65" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif">Alle Ma&#223;e in mm</text></svg>