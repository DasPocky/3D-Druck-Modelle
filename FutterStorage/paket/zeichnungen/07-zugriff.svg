 font-size="8.8" text-anchor="middle" fill="#6e6a65" font-family="ui-sans-serif, system-ui, sans-serif">Greifraum über der Beutelkante</text></g><line x1="150.0" y1="229.8" x2="60.0" y2="229.8" stroke="#a8a29a" stroke-width="0.7"/><line x1="150.0" y1="313.4" x2="60.0" y2="313.4" stroke="#a8a29a" stroke-width="0.7"/><line x1="54.0" y1="229.8" x2="54.0" y2="313.4" stroke="#bd4d0a" stroke-width="1.0"/><path d="M54.0,229.8 l-2.6,6.0 l5.2,0 z" fill="#bd4d0a"/><path d="M54.0,313.4 l-2.6,-6.0 l5.2,0 z" fill="#bd4d0a"/><g transform="translate(54.0,271.6) rotate(-90)"><rect x="-10.0" y="-7.5" width="20.0" height="11" fill="#f7f5f2"/><text x="0" y="3.6" font-size="10" text-anchor="middle" fill="#bd4d0a" font-weight="600" font-family="ui-monospace, Menlo, monospace">44</text></g><g transform="translate(38.0,271.6) rotate(-90)"><text x="0" y="0" font-size="8.8" text-anchor="middle" fill="#6e6a65" font-family="ui-sans-serif, system-ui, sans-serif">Beutel steht &#252;ber</text></g><text x="620.0" y="72.0" font-size="10.5" text-anchor="start" fill="#1a1a1e" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif">FRONTWAND VON VORNE</text><line x1="620.0" y1="77.0" x2="733.7" y2="77.0" stroke="#bd4d0a" stroke-width="1.4"/><rect x="620.0" y="190.0" width="180.9" height="183.9" fill="#e9e5de" stroke="#1a1a1e" stroke-width="1.2"/><rect x="636.3" y="244.7" width="148.2" height="117.8" fill="#f0d9c8" stroke="#bd4d0a" stroke-width="1.2"/><text x="710.4" y="307.6" font-size="10" text-anchor="middle" fill="#8a5a2a" font-weight="400" font-family="ui-sans-serif, system-ui, sans-serif">Schild</text><line x1="644.3" y1="254.7" x2="558.0" y2="226.1" stroke="#a8a29a" stroke-width="0.8"/><circle cx="558.0" cy="226.1" r="10.0" fill="#f7f5f2" stroke="#1a1a1e" stroke-width="1.1"/><text x="558.0" y="229.7" font-size="10" text-anchor="middle" fill="#1a1a1e" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">4</text><line x1="800.9" y1="190.0" x2="834.9" y2="190.0" stroke="#a8a29a" stroke-width="0.7"/><line x1="800.9" y1="373.9" x2="834.9" y2="373.9" stroke="#a8a29a" stroke-width="0.7"/><line x1="840.9" y1="190.0" x2="840.9" y2="373.9" stroke="#bd4d0a" stroke-width="1.0"/><path d="M840.9,190.0 l-2.6,6.0 l5.2,0 z" fill="#bd4d0a"/><path d="M840.9,373.9 l-2.6,-6.0 l5.2,0 z" fill="#bd4d0a"/><g transform="translate(840.9,282.0) rotate(-90)"><rect x="-10.0" y="-7.5" width="20.0" height="11" fill="#f7f5f2"/><text x="0" y="3.6" font-size="10" text-anchor="middle" fill="#bd4d0a" font-weight="600" font-family="ui-monospace, Menlo, monospace">92</text></g><g transform="translate(824.9,282.0) rotate(-90)"><text x="0" y="0" font-size="8.8" text-anchor="middle" fill="#6e6a65" font-family="ui-sans-serif, system-ui, sans-serif">Frontwand — ohne Mulde</text></g><text x="54.0" y="582.4" font-size="10.5" text-anchor="start" fill="#1a1a1e" font-weight="400" font-family="ui-sans-serif, system-ui, sans-serif">Gegriffen wird an der OBERKANTE des Beutels — Daumen und Zeigefinger fassen dort zu und ziehen ihn nach vorne heraus.</text><text x="54.0" y="603.4" font-size="10.5" text-anchor="start" fill="#6e6a65" font-weight="400" font-family="ui-sans-serif, system-ui, sans-serif">Der Platz daf&#252;r ist der Greifraum &#252;ber dem Beutel. Mit 42 mm passen zwei Finger neben die Kante.</text><text x="54.0" y="624.4" font-size="10.5" text-anchor="start" fill="#6e6a65" font-weight="400" font-family="ui-sans-serif, system-ui, sans-serif">Die Frontwand braucht deshalb keine Mulde: vor ihr ist der Kanal oberhalb der Wand ohnehin offen.</text><text x="580.0" y="640.4" font-size="9.5" text-anchor="start" fill="#6e6a65" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif">POSITIONEN</text><circle cx="588.0" cy="658.9" r="8.0" fill="none" stroke="#1a1a1e" stroke-width="1.0"/><text x="588.0" y="662.4" font-size="9" text-anchor="middle" fill="#1a1a1e" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1</text><text x="604.0" y="662.4" font-size="10" text-anchor="start" fill="#1a1a1e" font-weight="400" font-family="ui-sans-serif, system-ui, sans-serif">Frontwand, h&#228;lt den Stapel</text><text x="946.0" y="662.4" font-size="10" text-anchor="end" fill="#bd4d0a" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">92 hoch</text><circle cx="588.0" cy="677.9" r="8.0" fill="none" stroke="#1a1a1e" stroke-width="1.0"/><text x="588.0" y="681.4" font-size="9" text-anchor="middle" fill="#1a1a1e" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">2</text><text x="604.0" y="681.4" font-size="10" text-anchor="start" fill="#1a1a1e" font-weight="400" font-family="ui-sans-serif, system-ui, sans-serif">Greifraum &#252;ber der Beutelkante</text><text x="946.0" y="681.4" font-size="10" text-anchor="end" fill="#bd4d0a" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">42 hoch</text><circle cx="588.0" cy="696.9" r="8.0" fill="none" stroke="#1a1a1e" stroke-width="1.0"/><text x="588.0" y="700.4" font-size="9" text-anchor="middle" fill="#1a1a1e" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">3</text><text x="604.0" y="700.4" font-size="10" text-anchor="start" fill="#1a1a1e" font-weight="400" font-family="ui-sans-serif, system-ui, sans-serif">Beutel, steht &#252;ber die Wand</text><text x="946.0" y="700.4" font-size="10" text-anchor="end" fill="#bd4d0a" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">44 frei</text><circle cx="588.0" cy="715.9" r="8.0" fill="none" stroke="#1a1a1e" stroke-width="1.0"/><text x="588.0" y="719.4" font-size="9" text-anchor="middle" fill="#1a1a1e" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">4</text><text x="604.0" y="719.4" font-size="10" text-anchor="start" fill="#1a1a1e" font-weight="400" font-family="ui-sans-serif, system-ui, sans-serif">Schild in der Frontwandtasche</text><text x="946.0" y="719.4" font-size="10" text-anchor="end" fill="#bd4d0a" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">78 x 62</text></g><line x1="26" y1="714" x2="940" y2="714" stroke="#1a1a1e" stroke-width="1.6"/><text x="26" y="736" font-size="14" fill="#1a1a1e" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif">Zugriff</text><text x="26" y="753" font-size="10" fill="#6e6a65" font-family="ui-sans-serif, system-ui, sans-serif">Wo die Hand hinkommt und warum die Ebenen sich nicht gegenseitig blockieren</text><text x="940" y="736" font-size="11.5" fill="#bd4d0a" font-weight="700" text-anchor="end" font-family="ui-monospace, Menlo, monospace">TEIL 08</text><text x="940" y="753" font-size="10" fill="#6e6a65" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif">Alle Ma&#223;e in mm</text></svg>